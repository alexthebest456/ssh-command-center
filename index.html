<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SSH Command Center</title>
  <meta name="description" content="SSH — personal ops dashboard for builds, portfolio, and content." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#060e1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SSH" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply saved theme before paint (default: light/bright). Avoids a flash.
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("sshcc:theme") || "light"); } catch (e) {}
  </script>
</head>
<body>
  <div class="mobile-top">
    <button class="icon-btn" id="menuBtn" style="font-size:20px">☰</button>
    <span class="mark">SSH · COMMAND CENTER</span>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="mark">SSH · OPS</div>
        <div class="title">Command Center</div>
        <div class="sub">Blueprint // Live</div>
      </div>
      <nav id="nav"><!-- nav items injected --></nav>
      <div class="sidebar-foot">
        <button id="themeToggle" class="icon-btn" title="Toggle brightness" style="font-size:15px">☀</button>
        <span id="syncLabel">Local only</span>
        <span class="sync-dot local" id="syncDot"></span>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main id="main">
      <div id="view"><!-- active view injected --></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
